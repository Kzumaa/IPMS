services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - db:/var/lib/postgresql/data
    ports: [ "5432:5432" ]

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  laravel-php:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: secret
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_CLIENT: phpredis
      QUEUE_CONNECTION: database
    depends_on: [ db, redis ]

  laravel-nginx:
    image: nginx:1.27-alpine
    ports: [ "8080:80" ]
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ laravel-php ]
  frontend:
    build: ./frontend
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -lc "npm ci || npm install; npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: [ "5173:5173" ]
    environment:
      CHOKIDAR_USEPOLLING: "true"
volumes:
  db:
  frontend_node_modules:
